name: Build and deterministic acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "packaging/**"
      - ".github/workflows/**"

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install actual vector interpreters
        run: sudo apt-get update && sudo apt-get install -y ghostscript mupdf-tools
      - name: Portable tests and contracts
        run: ./scripts/test.sh
      - name: Build portable receiver
        run: dotnet build src/FoisonC24.WindowsReceiver -f net8.0 -c Release
      - name: End-to-end PostScript, geometry, simulated spool input and serial
        run: dotnet run --project tests/FoisonC24.CoreTests -f net8.0 -c Release -- /usr/bin/gs /usr/bin/mutool "$PWD/tests/fixtures" "$PWD/src/FoisonC24.WindowsReceiver/bin/Release/net8.0/FoisonC24Receiver.dll"

  windows:
    needs: ubuntu
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: choco install nsis --no-progress -y
      - name: Download and verify official interpreters, prerequisites and corresponding source
        run: python scripts/prepare-tools.py
      - name: Validate PowerShell syntax (Windows PowerShell)
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/packaging/windows/Install-Queue-Win7.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Build applications and test harness for actual .NET Framework
        run: |
          dotnet build src/FoisonC24.WindowsReceiver -f net48 -c Release
          dotnet build src/FoisonC24.Diagnostic -c Release
          dotnet build src/FoisonC24.Provisioner -c Release
          dotnet build tests/FoisonC24.CoreTests -f net48 -c Release
      - name: Run net48 acceptance with bundled Windows interpreters and simulated spool input
        shell: pwsh
        run: |
          & tests/FoisonC24.CoreTests/bin/Release/net48/FoisonC24.CoreTests.exe `
            "$PWD/packaging/windows/tools/gs/bin/gswin64c.exe" `
            "$PWD/packaging/windows/tools/mupdf/mutool.exe" `
            "$PWD/tests/fixtures" `
            "$PWD/src/FoisonC24.WindowsReceiver/bin/Release/net48/FoisonC24Receiver.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare complete installation tree
        shell: pwsh
        run: |
          Copy-Item src/FoisonC24.WindowsReceiver/bin/Release/net48/FoisonC24Receiver.exe packaging/windows/
          Copy-Item src/FoisonC24.Diagnostic/bin/Release/net48/FoisonC24Diagnostic.exe packaging/windows/
          Copy-Item src/FoisonC24.Diagnostic/bin/Release/net48/FoisonC24.Core.dll packaging/windows/
          Copy-Item src/FoisonC24.Provisioner/bin/Release/net48/FoisonC24Provisioner.exe packaging/windows/
          # Binary files are ignored in Git, so extract the exact tracked RedMon source distribution's companion binaries.
          python scripts/fetch-redmon.py
      - name: Real RedMon API smoke on disposable Windows 2022 spooler (not Win7)
        shell: powershell
        run: ./tests/windows-redmon-smoke.ps1
      - name: WinForms preview smoke and default physical gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $p = Start-Process packaging/windows/FoisonC24Diagnostic.exe -ArgumentList @('--ui-smoke', "`"$PWD/dist/UI-preview.png`"", "`"$PWD/tests/fixtures/square-20mm.ps`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Build full installer (not capture-only)
        shell: pwsh
        run: |
          Set-Location packaging/windows
          & "${env:ProgramFiles(x86)}/NSIS/makensis.exe" /WX /DOUTFILE=FoisonC24-Setup-x64.exe FoisonC24-Setup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect and package one client ZIP
        run: python scripts/package-client.py
      - uses: actions/upload-artifact@v4
        with:
          name: foison-c24-client-session
          path: |
            dist/FoisonC24-Cliente-Win7-x64.zip
            dist/FoisonC24-Setup-x64.exe
            dist/checksums.sha256
            dist/UI-preview.png
