name: Build and deterministic acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - 'VERSION'
      - 'Directory.Build.props'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/**'
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install actual vector interpreters
        run: sudo apt-get update && sudo apt-get install -y ghostscript mupdf-tools
      - name: Portable tests, text integrity and provisioning model (NOT Win7)
        run: |
          ./scripts/test.sh
          python3 scripts/check-encoding.py > encoding-audit.json
          python3 scripts/check-legacy-api.py
          pwsh -NoProfile -File tests/provisioning-matrix.ps1
          pwsh -NoProfile -File tests/process-runner.ps1
      - name: End-to-end vectors, simulated spool and serial
        run: |
          dotnet build src/FoisonC24.WindowsReceiver -f net8.0 -c Release
          dotnet run --project tests/FoisonC24.CoreTests -f net8.0 -c Release -- /usr/bin/gs /usr/bin/mutool "$PWD/tests/fixtures" "$PWD/src/FoisonC24.WindowsReceiver/bin/Release/net8.0/FoisonC24Receiver.dll"
  windows:
    needs: ubuntu
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned Unicode NSIS
        run: choco install nsis --version=3.10.0 --allow-downgrade --no-progress -y
      - name: Unified build, all tests, NSIS, PKZIP and byte verification
        run: python scripts/build-release.py
      - name: Probe actual PS2 CLR2 if already present (NOT Win7 validation)
        shell: powershell
        run: ./tests/windows-ps2-probe.ps1
      - name: NSIS real silent error, append/BOM/chronology and exit code
        shell: powershell
        run: |
          ./tests/windows-nsis-log.ps1
          ./tests/windows-nsis-start.ps1
      - name: Real isolated RedMon APIs (Windows 2022, NOT Win7)
        shell: powershell
        run: ./tests/windows-redmon-smoke.ps1
      - name: Actual installer pt-BR UI and truthful OS rejection
        shell: powershell
        run: ./tests/windows-installer-visual.ps1
      - name: Native Shell ZIP extraction and SHA256
        shell: powershell
        run: ./tests/windows-native-zip.ps1
      - name: WinForms preview and physical gate
        shell: pwsh
        run: |
          $p = Start-Process packaging/windows/FoisonC24Diagnostic.exe -ArgumentList @('--ui-smoke', "`"$PWD/dist/UI-preview.png`"", "`"$PWD/tests/fixtures/square-20mm.ps`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          $report = Join-Path $PWD 'dist/capture-diagnostics.log'
          $p = Start-Process packaging/windows/FoisonC24Diagnostic.exe -ArgumentList @('--capture-diagnostics', "`"$report`"") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Capture diagnostic report was not written' }
          $text = [IO.File]::ReadAllText($report)
          foreach ($section in @('[CAPTURE_FOLDER]', '[QUEUE]', '[SPOOLER]', 'não abriu COM')) {
            if (-not $text.Contains($section)) { throw "Missing diagnostic section: $section" }
          }
      - name: Guided diagnostic ZIP allowlist smoke (synthetic only)
        shell: powershell
        run: |
          $report = Join-Path $PWD 'dist/guided-diagnostic-smoke.zip'
          $p = Start-Process packaging/windows/FoisonC24Diagnostic.exe -ArgumentList @('--diagnostic-report-smoke', "`"$report`"") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Guided diagnostic ZIP smoke failed' }
          & 7z t $report
          if ($LASTEXITCODE -ne 0) { throw 'ZIP integrity check failed' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($report)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            $expected = @('application.log','capture-metadata.json','checksums.txt','environment.json','errors.log','receiver.log','printer-state.json','redmon-state.txt','summary.txt') | Sort-Object
            if (($names -join '|') -ne ($expected -join '|')) { throw 'Unexpected diagnostic report entries' }
            if ($zip.Entries | Where-Object { $_.FullName -match '\.(raw|pdf)$' }) { throw 'Raw user content found in report' }
            $summary = New-Object IO.StreamReader($zip.GetEntry('summary.txt').Open())
            try { $text = $summary.ReadToEnd() } finally { $summary.Dispose() }
            $notExecuted = 'N' + [char]0x00C3 + 'O EXECUTADOS'
            if (-not $text.Contains('Windows Spooler: UNKNOWN') -or -not $text.Contains($notExecuted)) { throw 'Smoke report must not claim real spooler/hardware validation' }
          } finally { $zip.Dispose() }
      - name: Preserve failure evidence, not customer jobs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/evidence | Out-Null
          Get-ChildItem $env:TEMP -Directory -Filter 'foison-matrix-*' | Copy-Item -Destination dist/evidence -Recurse
          Get-ChildItem $env:TEMP -Directory -Filter 'foison-bootstrap-*' | Copy-Item -Destination dist/evidence -Recurse
          if (Test-Path "$env:ProgramData/FoisonC24/Logs") { Copy-Item "$env:ProgramData/FoisonC24/Logs" dist/evidence -Recurse }
      # Avoid downloading a second copy of the EXE already inside the client ZIP.
      # The exact EXE is recoverable from ZIP and verified by the external CI hashes.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: foison-c24-client-zip
          if-no-files-found: error
          compression-level: 0
          path: dist/*/FoisonC24-v*-Win7-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foison-c24-validation-evidence
          if-no-files-found: error
          path: |
            dist/*/validation.json
            dist/*/SHA256SUMS.txt
            dist/*.log
            dist/UI-preview*.png
            dist/visual/
            dist/evidence/
